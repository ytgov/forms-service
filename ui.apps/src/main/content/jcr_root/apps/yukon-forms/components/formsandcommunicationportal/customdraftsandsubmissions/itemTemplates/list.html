<template data-sly-template.layout="${@ hideTime}">
    <table class="cmp-portallister__results cmp-portallister__results-list-container" data-cmp-hook-item-template="container">
        <thead class="cmp-portallister__results-list-head" style="display: none;">
            <tr>
                <th class="cmp-portallister__item-list-image-wrapper-head"></th>
                <th scope="col" class="cmp-portallister__item-list-title-head">Online form name</th>
                <th scope="col" class="cmp-portallister__item-list-body-head">Details</th>
                <th scope="col" class="cmp-portallister__item-list-time-head" data-sly-test="${!hideTime}">Date last modified</th>
                <th scope="col" class="cmp-portallister__item-list-operations-head"><span class="cmp-drafts-and-submissions__visually-hidden">Actions</span></th>
            </tr>
        </thead>
	<tr class="no-drafts-row">
	    <td>There are no drafts saved for this form.</td>
	</tr>
    </table>
    <table>
        <tr class="cmp-portallister__item cmp-portallister__item-list" data-cmp-hook-item-template="item">
            <td class="cmp-portallister__item-list-image-wrapper">
                <img class="cmp-portallister__item-list-image" alt="" data-cmp-hook-item-template="thumbnail"/>
            </td>
            <td class="cmp-portallister__item-list-title">
                <a class="cmp-portallister__item-list-link" data-cmp-hook-item-template="formLink">
                    <span data-cmp-hook-item-template="itemTitle"></span>
                </a>
            </td>
            <td class="cmp-portallister__item-list-body" data-cmp-hook-item-template="description"></td>
            <td data-sly-test="${!hideTime}" class="cmp-portallister__item-list-time" data-cmp-hook-item-template="timeinfo"></td>
            <td class="cmp-portallister__item-list-operations" data-cmp-hook-item-template="operations">
                <button type="button" class="cmp-portallister__item-list-operations-button" aria-haspopup="menu" aria-expanded="false" aria-label="Actions">
                    <span class="cmp-portallister__item-list-operations-icon" aria-hidden="true">&#8942;</span>
                </button>
            </td>
        </tr>
    </table>
</template>
